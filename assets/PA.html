<!DOCTYPE html>
<html>
<head>
<style>
body {
    font-family: Inter, sans-serif;
    padding: 2rem;
}

.flow-diagram {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.flow-step {
    width: 220px;
    background: #eff6ff;
    border: 1px solid #c7d2fe;
    border-radius: 10px;
    padding: 1rem;
    text-align: center;
    font-weight: 600;
    box-shadow: 0 4px 10px rgba(59,130,246,.12);
}

.flow-arrow {
    font-size: 1.5rem;
    color: #0366d6;
    margin: .25rem 0;
}
</style>
</head>
<body>

<div class="flow-diagram">

  <div class="flow-step">RDS Health Check</div><br>
  <div class="flow-step">Critical Alert Received</div><br>
  <div class="flow-step">Outlook Trigger</div><br>
  <div class="flow-step">Power Automate Processing</div><br>
  <div class="flow-step">Teams Adaptive Card Sent</div>

</div>

</body>
</html>
