<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 100" width="190" height="100" role="img" aria-label="US flag">
  <title>United States flag</title>
  <!-- base white -->
  <rect width="190" height="100" fill="#fff"/>

  <!-- 13 stripes -->
  <g fill="#b22234">
    <rect x="0" y="0" width="190" height="7.6923077"/>
    <rect x="0" y="15.3846154" width="190" height="7.6923077"/>
    <rect x="0" y="30.7692308" width="190" height="7.6923077"/>
    <rect x="0" y="46.1538462" width="190" height="7.6923077"/>
    <rect x="0" y="61.5384615" width="190" height="7.6923077"/>
    <rect x="0" y="76.9230769" width="190" height="7.6923077"/>
    <rect x="0" y="92.3076923" width="190" height="7.6923077"/>
  </g>

  <!-- blue canton (union) -->
  <rect x="0" y="0" width="76" height="53.8461538" fill="#3C3B6E"/>

  <!-- star shape -->
  <defs>
    <polygon id="star" points="0,-3 0.7,-1 2.9,-1 1.1,0.5 1.8,3 0,1.8 -1.8,3 -1.1,0.5 -2.9,-1 -0.7,-1" fill="#fff"/>
  </defs>

  <!-- 9 rows of stars (6,5 alternating) -->
  <g transform="translate(6,6)">
    <g transform="translate(0,0)">
      <use href="#star" x="0" y="0"/>
      <use href="#star" x="11" y="0"/>
      <use href="#star" x="22" y="0"/>
      <use href="#star" x="33" y="0"/>
      <use href="#star" x="44" y="0"/>
      <use href="#star" x="55" y="0"/>
    </g>
    <g transform="translate(5.5,6)">
      <use href="#star" x="0" y="0"/>
      <use href="#star" x="11" y="0"/>
      <use href="#star" x="22" y="0"/>
      <use href="#star" x="33" y="0"/>
      <use href="#star" x="44" y="0"/>
    </g>
    <g transform="translate(0,12)">
      <use href="#star" x="0" y="0"/>
      <use href="#star" x="11" y="0"/>
      <use href="#star" x="22" y="0"/>
      <use href="#star" x="33" y="0"/>
      <use href="#star" x="44" y="0"/>
      <use href="#star" x="55" y="0"/>
    </g>
    <g transform="translate(5.5,18)">
      <use href="#star" x="0" y="0"/>
      <use href="#star" x="11" y="0"/>
      <use href="#star" x="22" y="0"/>
      <use href="#star" x="33" y="0"/>
      <use href="#star" x="44" y="0"/>
    </g>
    <g transform="translate(0,24)">
      <use href="#star" x="0" y="0"/>
      <use href="#star" x="11" y="0"/>
      <use href="#star" x="22" y="0"/>
      <use href="#star" x="33" y="0"/>
      <use href="#star" x="44" y="0"/>
      <use href="#star" x="55" y="0"/>
    </g>
    <g transform="translate(5.5,30)">
      <use href="#star" x="0" y="0"/>
      <use href="#star" x="11" y="0"/>
      <use href="#star" x="22" y="0"/>
      <use href="#star" x="33" y="0"/>
      <use href="#star" x="44" y="0"/>
    </g>
    <g transform="translate(0,36)">
      <use href="#star" x="0" y="0"/>
      <use href="#star" x="11" y="0"/>
      <use href="#star" x="22" y="0"/>
      <use href="#star" x="33" y="0"/>
      <use href="#star" x="44" y="0"/>
      <use href="#star" x="55" y="0"/>
    </g>
    <g transform="translate(5.5,42)">
      <use href="#star" x="0" y="0"/>
      <use href="#star" x="11" y="0"/>
      <use href="#star" x="22" y="0"/>
      <use href="#star" x="33" y="0"/>
      <use href="#star" x="44" y="0"/>
    </g>
    <g transform="translate(0,48)">
      <use href="#star" x="0" y="0"/>
      <use href="#star" x="11" y="0"/>
      <use href="#star" x="22" y="0"/>
      <use href="#star" x="33" y="0"/>
      <use href="#star" x="44" y="0"/>
      <use href="#star" x="55" y="0"/>
    </g>
  </g>
</svg>